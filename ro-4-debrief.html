<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#FFC145}a:hover{color:#F5F3EE}
a:focus-visible,button:focus-visible{outline:2px solid #F5F3EE;outline-offset:2px}
.ch{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.dsp{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
</style>

<style>body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 0;box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; background: #0B0D12; color: #F5F3EE; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="lbl" style="color: #4CD7E6">Mission: Breakout · Debrief</span><span class="lbl ch" style="padding: 7px 12px; background: rgba(255,193,69,0.12); color: #FFC145; font-size: 13px">◆ 1,550</span></div>
<h1 class="dsp" style="margin: 0; font-size: 34px; line-height: 1">Queue cleared</h1>
</header>
<div aria-hidden="true" style="height: 3px; background: repeating-linear-gradient(135deg, #4CD7E6 0 6px, transparent 6px 12px)"></div>

<main style="flex: 1; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px">
<section class="ch" style="background: #FFC145; color: #0B0D12; padding: 20px; display: flex; justify-content: space-between; align-items: flex-end">
<span><span class="lbl" style="display: block">3 / 3 missions logged</span><span style="display: block; font-size: 14px; margin-top: 6px">Banked. Points never expire.</span></span>
<span class="dsp" style="font-size: 64px; line-height: .85">+300</span>
</section>

<section style="display: flex; flex-direction: column">
<sc-for list="{{log}}" as="l" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid rgba(245,243,238,0.10)">
<span class="lbl" style="color: #4CD7E6">{{l.n}}</span>
<span style="flex: 1; font-size: 15px; font-weight: 500">{{l.t}}</span>
<span class="lbl" style="color: #FFC145; font-size: 13px">+{{l.p}}</span>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between"><span class="lbl" style="color: #FFC145">Banked · Hero mini-mission</span><span class="lbl" style="font-size: 13px">1,550 / 2,500</span></div>
<div aria-label="62 percent" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px"><sc-for list="{{meter}}" as="m" hint-placeholder-count="10"><span style="height: 10px; background: {{m}}"></span></sc-for></div>
<span style="font-size: 13px; color: #A3A9B6">Points carry over. Spend on a pin now, or keep saving.</span>
</section>

<div class="ch" style="padding: 14px; background: #151922; font-size: 14px; line-height: 1.5"><span class="lbl" style="display: block; color: #FF5B2E; margin-bottom: 4px">Today's drop: done</span>Three new quests land tomorrow at park open. Campus patrol is still open today.</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<a href="ro-5-rewards.html" class="ch" style="height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #F5F3EE; color: #0B0D12; text-decoration: none"><span class="dsp" style="font-size: 16px">See rewards</span><span aria-hidden="true">→</span></a>
<a href="ro-1-base.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(245,243,238,0.22); color: #F5F3EE; text-decoration: none; font-weight: 500; font-size: 15px">Back to base</a>
</div>
</main>

<nav aria-label="Recruit Ops" style="height: 76px; flex: none; background: #11141A; border-top: 1px solid rgba(245,243,238,0.10); display: flex">
<a href="ro-1-base.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #A3A9B6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 21 7v10l-9 5-9-5V7z"/></svg><span class="lbl">Base</span></a>
<a href="ro-2-tapin.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #A3A9B6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 8a6 6 0 0 1 0 8M12 5a10 10 0 0 1 0 14M4 11a2 2 0 0 1 0 2"/></svg><span class="lbl">Tap in</span></a>
<a href="ro-3-mission.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #FF5B2E; border-top: 2px solid #FF5B2E"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg><span class="lbl">Missions</span></a>
<a href="ro-5-rewards.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #A3A9B6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 12 12 21 4 12z"/></svg><span class="lbl">Rewards</span></a>
</nav>
</div>
</template>
<script src="dc.js"></script>
<script>window.__EXT={};

class Component extends DCLogic {
  renderVals() {
    const meter = [];
    for (let i = 0; i < 10; i++) meter.push(i < 6 ? '#FFC145' : '#1E2330');
    return {
      meter,
      log: [
        { n: '01', t: 'Spot the artifact', p: 100 },
        { n: '02', t: 'Queue trivia', p: 100 },
        { n: '03', t: 'Sound check', p: 100 }
      ]
    };
  }
}

dcBoot(Component,{});
</script>
</body>
</html>
