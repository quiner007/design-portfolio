.fut{display:flex;flex-direction:column;gap:14px;align-items:flex-start}

.fuc{position:absolute;left:12px;bottom:12px;padding:6px 10px;border-radius:999px;background:rgba(20,30,24,.78);font-size:11px;font-weight:700;letter-spacing:.14em}
.fua{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;margin-top:8px;padding-top:24px;border-top:1px solid rgba(255,255,255,.22)}

.fup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fpo{display:flex;flex-direction:column;gap:8px;rotate:var(--r);transition:rotate .6s cubic-bezier(.34,1.56,.64,1),translate .6s cubic-bezier(.34,1.56,.64,1)}

.fpo>span{font-size:12px;font-weight:600;color:rgba(255,255,255,.84)}
.fub:hover .fpo{rotate:0deg}.fpo:hover{translate:0 -8px}
@media (max-width:860px){.fup{grid-template-columns:1fr 1fr}.fub{grid-template-columns:1fr}.sqg,.xg{grid-template-columns:1fr}.sc{min-height:480px}.sct{padding:30px 26px 16px}.eps{left:26px;right:26px}}

/* ---------- Brand: Q mark + palette ---------- */

/*QVCSS*/:root{--qvol:.8}
.mx-knob{position:relative;flex:none;width:40px;height:40px;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none;display:flex;align-items:center;justify-content:center}
.mx-knob:focus-visible{box-shadow:0 0 0 3px #F5AD0B}
.mx-kring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -135deg,#F5AD0B calc(var(--qvol)*270deg),rgba(255,255,255,.16) 0 270deg,transparent 0);-webkit-mask:radial-gradient(circle,transparent 13px,#000 14px);mask:radial-gradient(circle,transparent 13px,#000 14px)}
.mx-kcap{position:relative;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a3f5a,#211A2A);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12);rotate:calc(var(--qvol)*270deg - 135deg);transition:rotate .08s}

@media (max-width:420px){.mx-knob{width:34px;height:34px}.mx-kring{-webkit-mask:radial-gradient(circle,transparent 11px,#000 12px);mask:radial-gradient(circle,transparent 11px,#000 12px)}.mx-kcap{width:20px;height:20px}}
/*QVCSS-END*/
/*QTH*/.qth{appearance:none;width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:inline-grid;place-items:center;cursor:pointer;padding:0;margin-left:4px;transition:rotate .5s cubic-bezier(.34,1.56,.64,1),background .3s}
.qth:hover{rotate:-20deg}.qth:focus-visible{outline:2px solid #F5AD0B;outline-offset:2px}
.qth svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;grid-area:1/1}
.qth .qmoon{fill:currentColor;stroke:none}
.qth .qmoon{display:none}
@media (prefers-color-scheme: light){.qth .qsun{display:none}.qth .qmoon{display:block}}
:root[data-theme="light"] .qth .qsun{display:none}:root[data-theme="light"] .qth .qmoon{display:block}
:root[data-theme="dark"] .qth .qsun{display:block}:root[data-theme="dark"] .qth .qmoon{display:none}

@media (max-width:600px){header .mx-nl{white-space:nowrap;letter-spacing:.06em!important;font-size:12px!important;padding:0 5px!important}.qth{width:40px;height:40px;margin-left:0}header .mx-btn[href="resume.html"]{padding:0 14px!important;margin-left:4px!important;letter-spacing:.08em!important}}
:root[data-theme="light"]{--bg:#F6F5F0;--bg-rgb:246,245,240;--surface:#ECEAE2;--surface2:#F1F0EA;--line:#DCD9CF;--text:#2A2235;--muted:#605A69;--a-yellow:#A86A00;--a-blue:#C4136A;--a-green:#2E7A16;--a-red:#D2391C;color-scheme:light}:root[data-theme="dark"]{--bg:#211A2A;--bg-rgb:33,26,42;--surface:#2B2336;--surface2:#261F30;--line:#40364D;--text:#F6F5F0;--muted:#B9B1C4;--on-accent:#211A2A;--a-yellow:#F5AD0B;--a-blue:#F04A92;--a-green:#5DB83A;--a-red:#FF5A3D;color-scheme:dark}

/* ---------- Matinee motion ---------- */
@keyframes mx-rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes mx-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes mx-spin{to{transform:rotate(360deg)}}
@keyframes mx-word{from{opacity:0;transform:translateY(70%) rotate(6deg)}to{opacity:1;transform:none}}
@keyframes mx-sunrise{from{transform:translateY(140px)}to{transform:none}}
@keyframes mx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes mx-tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes mx-mq{to{transform:translateX(-50%)}}

@keyframes mx-eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

.mx-prog{position:fixed;left:0;top:0;height:4px;width:100%;z-index:70;pointer-events:none;background:linear-gradient(90deg,#E9260B,#F5AD0B,#E32076,#4FA82D);transform-origin:0 50%;transform:scaleX(0)}

.mx-btn,.mx-pill{position:relative;overflow:hidden;isolation:isolate;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .45s cubic-bezier(.34,1.56,.64,1)}
.mx-btn::after,.mx-pill::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}

.mx-btn:hover::after,a:hover .mx-pill::after{transform:translateX(130%)}
