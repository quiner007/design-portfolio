<body>
<div id="root"></div>
<template id="dc-template">
<div class="scr">
<main style="padding:62px 16px 0;display:flex;flex-direction:column">
<a href="cue-language.html" class="co" style="display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-left:-6px;align-self:flex-start"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Language</a>
<h1 class="lt">Volume + Translate</h1>
<p class="sh sec" style="margin:2px 0 0">Two gestures from AirPods, rebuilt for a bigger earcup.</p>

<section class="card" style="margin-top:16px" aria-live="polite">
<div style="display:flex;align-items:center;gap:12px">
<span aria-hidden="true" style="position:relative;flex:none;width:44px;height:64px;border-radius:22px;background:#2c2c2e;border:1px solid rgba(84,84,88,0.65);overflow:hidden;display:flex;align-items:center;justify-content:center"><svg class="swipe" width="16" height="22" viewBox="0 0 16 22"><path d="M8 2v18M2 8l6-6 6 6" fill="none" stroke="#f83c52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<div style="flex:1;min-width:0"><h2 class="t3">Swipe to set volume</h2><p class="fn sec" style="margin:2px 0 0">Up or down on the earcup. A tick per step, and the pitch climbs as it gets louder.</p></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="fn sec">Volume</span><span class="ros">{{vol}} of 16</span></div>
<div role="img" aria-label="Volume {{vol}} of 16" style="display:flex;gap:3px;align-items:flex-end"><sc-for list="{{segs}}" as="s"><span class="seg" style="{{s.style}}"></span></sc-for></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="btn2" onClick="{{down}}" aria-label="Swipe down, volume down"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M2 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Swipe down</button>
<button class="btn2" onClick="{{up}}" aria-label="Swipe up, volume up"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 13V1M2 6l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Swipe up</button>
</div>
</section>

<section class="card" style="margin-top:12px" aria-live="polite">
<div style="display:flex;align-items:center;gap:12px">
<span aria-hidden="true" style="flex:none;display:flex;gap:4px"><span style="{{cupStyle}}"></span><span style="{{cupStyle}}"></span></span>
<div style="flex:1;min-width:0"><h2 class="t3">Hold both to translate</h2><p class="fn sec" style="margin:2px 0 0">Two hands, so it never starts by accident. A low-high chime says it's listening.</p></div>
</div>
<div style="display:flex;align-items:center;gap:8px;min-height:28px"><span class="{{dotCls}}" style="{{dotStyle}}"></span><span class="sh">{{tState}}</span><span class="fn sec" style="margin-left:auto">Spanish → English</span></div>
<sc-if value="{{on}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:6px">
<span class="bub sh" style="align-self:flex-start;background:#2c2c2e">¿Dónde está el andén dos?</span>
<span class="bub sh" style="align-self:flex-end;background:#d0102f;animation-delay:200ms">Where is platform two?</span>
</div>
</sc-if>
<button class="btn2" onClick="{{hold}}" style="{{holdStyle}}">{{holdLabel}}</button>

<script src="dc.js"></script>
<script>window.__EXT={};

class Component extends DCLogic {
  tone(seq) {
    if (this.props.sound === false) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ac = this.ac || new AC(); const ac = this.ac; if (ac.state === 'suspended') ac.resume();
      seq.forEach((p) => { const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + 0.02 + p.t / 1000, e = s + p.d / 1000;
        o.type = 'sine'; o.frequency.setValueAtTime(p.f, s); g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.18, s + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, e);
        o.connect(g); g.connect(ac.destination); o.start(s); o.stop(e + 0.03); });
    } catch (err) {}
  }
  renderVals() {
    const st = this.state || {};
    const vol = st.vol == null ? 9 : st.vol;
    const on = st.on == null ? true : st.on;
    const set = (v) => { const nv = Math.max(0, Math.min(16, v)); this.setState({ vol: nv }); this.tone([{ t: 0, d: 30, f: 600 + nv * 60 }]); };
    const segs = [];
    for (let i = 1; i <= 16; i++) segs.push({ style: 'height:' + (8 + i * 1.1) + 'px;background-color:' + (i <= vol ? (i > 13 ? '#ff6b57' : '#f83c52') : 'rgba(120,120,128,0.36)') });
    const cup = 'display:block;width:14px;height:30px;border-radius:8px;background:' + (on ? '#f83c52' : '#2c2c2e') + ';border:1px solid rgba(84,84,88,0.65);transition:background-color 300ms ease';
    return {
      vol, segs, on,
      up: () => set(vol + 1), down: () => set(vol - 1),
      cupStyle: cup,
      dotCls: on ? 'pulse' : '',
      dotStyle: 'width:10px;height:10px;border-radius:999px;flex:none;background:' + (on ? '#30d158' : '#8e8e93'),
      tState: on ? 'Live Translation · Listening' : 'Live Translation · Off',
      holdLabel: on ? 'Hold both again to stop' : 'Hold both earcups',
      holdStyle: on ? '' : 'background:#d0102f',
      hold: () => { this.setState({ on: !on }); this.tone(on ? [{ t: 0, d: 120, f: 784 }, { t: 140, d: 160, f: 523 }] : [{ t: 0, d: 120, f: 523 }, { t: 140, d: 160, f: 784 }]); }
    };
  }
}

dcBoot(Component,{"sound": true});
</script>
