.mx-prog{position:fixed;left:0;top:0;height:4px;width:100%;z-index:70;pointer-events:none;background:linear-gradient(90deg,#E9260B,#F5AD0B,#E32076,#4FA82D);transform-origin:0 50%;transform:scaleX(0)}
@supports (animation-timeline: scroll()){.mx-prog{animation:mx-grow linear both;animation-timeline:scroll(root)}}

.mx-btn,.mx-pill{position:relative;overflow:hidden;isolation:isolate;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .45s cubic-bezier(.34,1.56,.64,1)}
.mx-btn::after,.mx-pill::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.mx-btn:hover,a:hover>.mx-pill,a:hover .mx-pill{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 7px 0 rgba(0,0,0,.42)}
.mx-btn:hover::after,a:hover .mx-pill::after{transform:translateX(130%)}
.mx-btn:active,a:active .mx-pill{transform:translateY(2px) scale(.98);box-shadow:0 0 0 rgba(0,0,0,.42);transition-duration:.08s}
.mx-arr{display:inline-block;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
a:hover .mx-arr,button:hover .mx-arr{transform:translateX(10px)}
a:hover .mx-arr.up{transform:translate(5px,-5px)}
.mx-arr.dn{animation:mx-bob 1.8s ease-in-out infinite}
.mx-nl{background:linear-gradient(currentColor,currentColor) no-repeat 50% calc(100% - 9px)/0 2px;transition:background-size .35s cubic-bezier(.34,1.56,.64,1)}
.mx-nl:hover,.mx-nl[aria-current="page"]{background-size:calc(100% - 28px) 2px}
.mx-star{transform-origin:center;animation:mx-spin 14s linear infinite}
a:hover .mx-star{animation-duration:1.2s}
.mx-poster{transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s}
.mx-poster:hover{transform:translateY(-8px);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.mx-poster>img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.mx-poster:hover>img{transform:scale(1.05)}
.mx-poster .mx-sun{transform-box:fill-box;transform-origin:center;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mx-poster:hover .mx-sun{transform:translateY(-60px) scale(1.12)}
.mx-trio{transition:transform .8s cubic-bezier(.2,.8,.2,1),gap .8s cubic-bezier(.2,.8,.2,1)}
.mx-poster:hover .mx-trio{transform:scale(1.04);gap:6%!important}
.mx-card{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.mx-card:hover{transform:translateY(-8px) rotate(-.4deg)}
.mx-card span[style*="overflow: hidden"]>img,.mx-card span[style*="overflow: hidden"]>svg{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.mx-card:hover span[style*="overflow: hidden"]>img,.mx-card:hover span[style*="overflow: hidden"]>svg{transform:scale(1.06)}
.mx-chip{transition:transform .35s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.mx-chip:hover{transform:translateY(-3px) rotate(-3deg);border-color:#F5AD0B!important}
.mx-w{display:inline-block;animation:mx-word 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 80ms + 120ms)}
.mx-in{animation:mx-fade .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:.7s}
.mx-hsun{transform-box:fill-box;transform-origin:center;animation:mx-sunrise 2.2s cubic-bezier(.2,.8,.2,1) both}
.mx-hsun2{animation:mx-float 7s ease-in-out 2.2s infinite}
.mx-tw{transform-box:fill-box;transform-origin:center;animation:mx-tw 3.4s ease-in-out infinite}
.mx-mq{animation:mx-mq 36s linear infinite}
.mx-mqw:hover .mx-mq{animation-play-state:paused}
.mx-player{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.mx-player:hover{transform:translateY(-3px)}
.mx-disc{transition:transform .4s}
.mx-player.is-on .mx-disc{animation:mx-spin 3s linear infinite}
.mx-eq i{display:block;width:3px;height:16px;border-radius:2px;background:#F5AD0B;transform-origin:50% 100%;transform:scaleY(.25)}
.mx-player.is-on .mx-eq i{animation:mx-eq .9s ease-in-out infinite}
.mx-player.is-on .mx-eq i:nth-child(2){animation-delay:-.3s}.mx-player.is-on .mx-eq i:nth-child(3){animation-delay:-.6s}.mx-player.is-on .mx-eq i:nth-child(4){animation-delay:-.15s}

.mx-pb:hover{transform:scale(1.12)}.mx-pb:active{transform:scale(.92)}

}

<h1 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(44px, 6vw, 84px); line-height: 1">Godzilla: Destroy All Monsters Melee</h1>
<p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 18px; line-height: 29px; color: rgba(255,255,255,.84)">Bringing a 2002 kaiju brawler online without losing what made it fun. I read the playtests, the player reviews and ten rival launches, then told the team what to fix first and how it should feel.</p></div>

<section class="mx-rv" style="display: flex; flex-direction: column; gap: 22px"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">THE 10-SECOND VERSION</span>
<p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(26px, 3.2vw, 40px); line-height: 1.15; max-width: 980px">The game already felt right. My job was making sure online, the menus and the hit feedback didn't get in the way of that, and ranking what to fix before launch.</p>

<div class="hudx"><div class="shotw"><img src="assets/e6292977ab0f29da5f586cabd0b48b11.jpg" alt="Annotated in-game screenshot" loading="lazy"><span class="pin trg" tabindex="0" role="button" aria-label="1: Health + recent damage" data-p="1" style="left: 22%; top: 7%; --c: #4FA82D">1</span><span class="pin trg" tabindex="0" role="button" aria-label="2: Round + timer" data-p="2" style="left: 50%; top: 8%; --c: #F5AD0B">2</span><span class="pin trg" tabindex="0" role="button" aria-label="3: Portrait tiles" data-p="3" style="left: 3%; top: 17%; --c: #E32076">3</span><span class="pin trg" tabindex="0" role="button" aria-label="4: Hit flash" data-p="4" style="left: 47%; top: 44%; --c: #E9260B">4</span><span class="pin trg" tabindex="0" role="button" aria-label="5: Hit spark" data-p="5" style="left: 36%; top: 76%; --c: #3D7BFF">5</span></div><div class="pinfo"><div class="ptabs"><span class="pq trg" tabindex="0" role="button" data-p="1" style="--c: #4FA82D">1</span><span class="pq trg" tabindex="0" role="button" data-p="2" style="--c: #F5AD0B">2</span><span class="pq trg" tabindex="0" role="button" data-p="3" style="--c: #E32076">3</span><span class="pq trg" tabindex="0" role="button" data-p="4" style="--c: #E9260B">4</span><span class="pq trg" tabindex="0" role="button" data-p="5" style="--c: #3D7BFF">5</span><span class="phint">Hover or tap a number</span></div><div class="pds"><div class="pd" data-p="1" style="--c: #4FA82D"><b>Health + recent damage</b><span>The red chunk (−19.8) shows what that last hit cost. Great for reading trades.</span></div><div class="pd" data-p="2" style="--c: #F5AD0B"><b>Round + timer</b><span>Big, centered, boxed. Readable from the couch.</span></div><div class="pd" data-p="3" style="--c: #E32076"><b>Portrait tiles</b><span>P1 red, CPU green. You know who is who before you read a name.</span></div><div class="pd" data-p="4" style="--c: #E9260B"><b>Hit flash</b><span>That red Godzilla is P1 taking a hit. The flash sells it, but on a red canyon stage the fighter and the cliffs start to blend together.</span></div><div class="pd" data-p="5" style="--c: #3D7BFF"><b>Hit spark</b><span>Bright, sharp, ringed. Hits read. Blocks and parries need the same love.</span></div></div></div></div></section>

<section class="gsec mx-rv" id="scope"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">01: SCOPE</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">Does a retro fighter need the full feature set?</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">The design lead's real question: do we need everything Street Fighter 6 has? I studied ten launches across fighting games, shooters and party games to find what players actually punish.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">The answer was clear. Deep competitive tools are optional. Lobbies, friend invites, crossplay and real matchmaking are not, and patching them in later doesn't work, because the players are gone before the patch lands.</p><div class="quote"><b>My call:</b> protect matchmaking and lobbies in the launch schedule and QA, skip deep competitive systems, and use cheap post-launch extras like skins to keep it feeling alive.</div></div><div class="gfig"><div class="xy"><span style="font-weight: 800; font-size: 18px">Players left after launch, before the "we'll patch it in" fix shipped</span>

<section class="gsec mx-rv" id="match"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">02: MATCHMAKING</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">Make online “just work”</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">Next question: how should region, ping and skill fit together? I broke nine games into three tiers. Only the top tier pairs automatic search widening with connection info the player can see.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">My proposal: start with your region and similar connections, widen on a timer, and show the opponent's connection bars before the match so players can back out instead of getting a mystery result.</p></div><div class="gfig"><div class="tiers"><div style="--c: #429123"><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; font-size: 17px">Algorithmic</span><span style="font-size: 14px; line-height: 1.45; color: var(--muted)">Region, ping and skill in one score. Starts narrow, widens. Halo Infinite, SF6.</span></div><div style="--c: #F5AD0B"><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; font-size: 17px">Pick a region</span><span style="font-size: 14px; line-height: 1.45; color: var(--muted)">Player chooses a server and hopes. MultiVersus, Brawlhalla.</span></div><div style="--c: #E32076"><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; font-size: 17px">No matching</span><span style="font-size: 14px; line-height: 1.45; color: var(--muted)">Raw pairing or lobby browsing. The most connection complaints.</span></div></div></div></section>

<section class="gsec mx-rv" id="playtests"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">03: PLAYTESTS</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">Two playtests, read as one</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">We ran two online playtests two months apart with different tester pools: 45 people in all. Read alone, each one is noisy. Read together, anything both groups hit independently is real signal, so I ranked fixes by how well they were confirmed, not just by mention count.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">I also caught a data problem: testers from another region had joined one regional session and dragged its scores down. Fixing how we tag testers mattered as much as fixing the game.</p></div><div class="gfig"><div class="rank"><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 24px; color: #E32076">01</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 17px">Throws near walls warp fighters</b><span style="font-size: 15px; line-height: 1.5; color: var(--muted)">Both playtests hit it on their own. I pinned the trigger: throws close to a stage boundary.</span></span><span class="tag" style="background: var(--surface); color: var(--muted)">Gameplay, netcode</span></div><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 24px; color: #E32076">02</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 17px">Connection icon is too big and cries wolf</b><span style="font-size: 15px; line-height: 1.5; color: var(--muted)">Called out in both rounds as oversized, often with no real lag behind it.</span></span><span class="tag" style="background: var(--surface); color: var(--muted)">UI / UX</span></div><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 24px; color: #E32076">03</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 17px">"Fight" reads like a label, not a button</b><span style="font-size: 15px; line-height: 1.5; color: var(--muted)">Players sat waiting on opponents who were waiting on them. Sides were also mirrored from the health bars.</span></span><span class="tag" style="background: var(--surface); color: var(--muted)">UI / UX</span></div><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 24px; color: #E32076">04</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 17px">Long-distance matches feel delayed</b><span style="font-size: 15px; line-height: 1.5; color: var(--muted)">Input delay clustered with the farthest pairings, not as a general bug.</span></span><span class="tag" style="background: var(--surface); color: var(--muted)">Networking</span></div><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 24px; color: #E32076">05</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 17px">Small regions wait longer</b><span style="font-size: 15px; line-height: 1.5; color: var(--muted)">Matchmaking speed was fine on average, but thin pools stalled.</span></span><span class="tag" style="background: var(--surface); color: var(--muted)">Networking</span></div></div></div></section>

<section class="gsec mx-rv" id="redesign"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">04: UI FIXES</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">Redesigning what confused people</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">Two of the top five were UI problems I could solve on paper right away. Character select needed a control that looks pressable and a clear state for every player, up to four, with slots that match where you spawn.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">The connection warning needed to stop shouting. A three-tier indicator stays hidden when things are fine and only speaks up when there's something players can act on.</p></div><div class="gfig"><div class="ba" style="grid-template-columns: 1fr"><div><span class="tag" style="background: rgba(227,32,118,.14); color: #E32076">AS SHIPPED</span><div style="position: relative; border-radius: 16px; overflow: hidden"><img src="assets/a8227edf4527d71bb5d866d734f54343.jpg" alt="In-game character select: Godzilla on the podium, level, zone, forecast and mode in the center panel, roster carousel below. The word Fight sits faded in the background." loading="lazy" style="width: 100%; display: block"><svg viewBox="0 0 1600 900" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><circle cx="845" cy="272" r="74" fill="none" stroke="#E32076" stroke-width="5" stroke-dasharray="12 10"/><path d="M940 236 L1400 236 L1390 280 L930 280Z" fill="#101217" opacity=".94"/><text x="1162" y="265" font-family="Lexend, sans-serif" font-weight="800" font-size="19" fill="#ff7aa8" text-anchor="middle">FIGHT reads like background art</text></svg></div></div><div><span class="tag" style="background: rgba(66,145,35,.16); color: #429123">PROPOSAL MOCKUP</span><svg viewBox="0 0 1600 900" role="img" aria-label="Proposed four-player character select: four equal slots. P1 Godzilla ready, P2 Gigan ready, P3 still picking, P4 open with an invite button. Match settings sit in one strip on top and one Ready to Fight button sits at the bottom." style="width: 100%; height: auto; display: block; border-radius: 16px">

<section class="gsec mx-rv" id="calm"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">04b: LESS HUD, SAME INFO</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">A calmer HUD on the same frame</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">Kaiju are huge, so the stage should get the screen. I kept everything a player reads mid-fight and cut the boxes around it.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">Health becomes one slim bar with the last hit's cost as a fading red chunk, so you read trades without a number. The round box turns into a timer and three pips. Portraits shrink to rings in each player's color.</p></div><div class="gfig"><figure class="gfig" style="margin: 0; display: flex; flex-direction: column; gap: 18px"><div class="cmp" tabindex="0" role="button" aria-label="Proposal: decluttered HUD. Hover or tap to see the shipped HUD"><img src="assets/2422dd59a82d195af5cd5b1c6fa8aee2.jpg" alt="Decluttered HUD proposal on the in-game frame: slim health bars, portrait rings and a small timer with round pips" loading="lazy"><img class="orig" src="assets/e6292977ab0f29da5f586cabd0b48b11.jpg" alt="" loading="lazy"><svg viewBox="0 0 1600 900" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><g transform=""><path d="M130 92 L560 92 L554 104 L124 104Z" fill="rgba(0,0,0,.55)"/><path d="M130 92 L397 92 L391 104 L124 104Z" fill="#5BE35B"/><path d="M397 92 L431 92 L425 104 L391 104Z" fill="#ff4b52" opacity=".85"/><path d="M130 112 L330 112 L328 116 L128 116Z" fill="rgba(0,0,0,.5)"/><path d="M130 112 L230 112 L228 116 L128 116Z" fill="#F5AD0B"/></g><g transform="translate(1600 0) scale(-1 1)"><path d="M130 92 L560 92 L554 104 L124 104Z" fill="rgba(0,0,0,.55)"/><path d="M130 92 L500 92 L494 104 L124 104Z" fill="#5BE35B"/><path d="M130 112 L330 112 L328 116 L128 116Z" fill="rgba(0,0,0,.5)"/><path d="M130 112 L290 112 L288 116 L128 116Z" fill="#F5AD0B"/></g><text x="132" y="82" font-family="Barlow Condensed, sans-serif" font-weight="500" font-weight="800" font-size="28" fill="#fff">GODZILLA</text><text x="545" y="82" text-anchor="end" font-family="Barlow Condensed, sans-serif" font-weight="500" font-weight="800" font-size="17" fill="rgba(255,255,255,.55)">LV 1</text><text x="1468" y="82" font-family="Barlow Condensed, sans-serif" font-weight="500" font-weight="800" font-size="28" fill="#fff" text-anchor="end">ANGUIRUS</text><text x="1055" y="82" font-family="Barlow Condensed, sans-serif" font-weight="500" font-weight="800" font-size="17" fill="rgba(255,255,255,.55)">LV 1</text><text x="800" y="92" font-family="Barlow Condensed, sans-serif" font-weight="500" font-weight="800" font-size="50" fill="#fff" text-anchor="middle">4:57</text><circle cx="784" cy="110" r="4" fill="#F5AD0B"/><circle cx="800" cy="110" r="4" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="816" cy="110" r="4" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/></svg><span class="cmpk"><i>PROPOSAL, HOVER FOR SHIPPED</i><b>AS SHIPPED</b></span></div>
<div class="hnotes"><div style="--c: #429123"><b>Slim bars</b><span>One bar per fighter. Energy sits under it as a thin line.</span></div><div style="--c: #F5AD0B"><b>Timer + pips</b><span>No round box. Three dots tell you where you are in the set.</span></div><div style="--c: #E32076"><b>Rings, not tiles</b><span>Player color does the work the big portrait plates did.</span></div></div><figcaption>Mocked up on an in-game capture. Hover or tap the frame to compare.</figcaption></figure></div></section>

<section class="gsec mx-rv" id="feel"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">05: GAME FEEL</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">Making hits, blocks and parries read</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">On VFX and gameplay, I scored the build against the GameCube original across seven categories. Hits already felt big and the retro color language was readable. Blocking and parrying were the gap: they didn't feel impactful, so players couldn't tell when to use them.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">My fix was about timing, not more particles: impact frames, a short freeze on a parry and a color shift from a little to a lot, so the biggest moments, like an ultimate, feel like the biggest moments.</p></div><div class="gfig"><div class="vfxd"><div class="vfxh"><span class="big">3.7<small> / 5</small></span><span class="tf"><b>Top fix before the next build</b>More impact frames, with longer or new VFX on blocks and parries.</span></div><div class="vfxc"><div style="--c: #429123"><span class="hd">Already lands<span>4 of 5</span></span><ul><li>Hit spark clarity<span class="dots" style="--c: #429123" aria-label="4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span></li><li>Hitstop + screen flash<span class="dots" style="--c: #429123" aria-label="4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span></li><li>VFX vs. background<span class="dots" style="--c: #429123" aria-label="4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span></li><li>Hit vs. counter color<span class="dots" style="--c: #429123" aria-label="4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span></li></ul></div><div style="--c: #E32076"><span class="hd">Needs more punch<span>3 of 5</span></span><ul><li>Block + parry feedback<span class="dots" style="--c: #E32076" aria-label="3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></li><li>Special move VFX<span class="dots" style="--c: #E32076" aria-label="3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></li><li>Combo + juggle legibility<span class="dots" style="--c: #E32076" aria-label="3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></li></ul></div></div><span style="font-size: 13px; color: var(--muted)">Seven categories scored against the GameCube original. Passes the legacy check, with notes.</span></div>

<section class="gsec mx-rv" id="launch"><div class="gtx"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">06: DEMO LAUNCH</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">Listening once real players arrived</h2><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--text)">When the Steam demo went live, I swept reviews, forum threads and Twitch clips into one ranked log so the team could see the pattern instead of the loudest post.</p><p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted)">The demo set the tone, and the full game launched on November 3 at Overwhelmingly Positive on Steam. Demo players loved the original feel and online 1v1. They asked for button rebinding, a tutorial, friend invites and more punch in the effects, which lined up with what the playtests and VFX review had already flagged.</p></div><div class="gfig"><div style="display: flex; flex-direction: column; gap: 14px">
<div class="gstat" style="grid-template-columns: repeat(2, minmax(0, 1fr))"><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 48px; line-height: 1; color: #429123">96%</span><span style="font-size: 15px; color: var(--muted)">positive on Steam across 902 reviews, Overwhelmingly Positive at launch</span></div><div><span style="font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: 48px; line-height: 1; color: #F5AD0B">Top 5</span><span style="font-size: 15px; color: var(--muted)">issues ranked, each linked to the players who raised it</span></div></div>
<div class="quote">"Several want the red rage glow and more punchy beams back."<cite>From my findings log, effects feedback</cite></div>
<div class="quote">"You must fully release the left stick to run a combo."<cite>From my findings log, controls</cite></div></div></div></section>

<section class="mx-rv" id="docs" style="display: flex; flex-direction: column; gap: 22px"><span style="font-family: 'Lexend', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: #E32076">MY PROCESS</span><h2 style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(32px, 4vw, 52px); line-height: 1">How I get from feedback to fixes</h2>
<p style="margin: 0; font-family: 'Lexend', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: var(--muted); max-width: 760px">Every round runs the same loop: collect what players said, score it against the original, rank what matters, and hand leads something they can act on in two minutes. These are pages from each step. Tester names and vendor details are removed here.</p>
<div class="docs"><figure class="doc" style="--r: -4deg"><img src="assets/efcbdeb4868206db6d5ad9f79740af6f.jpg" alt="Page from Combined playtest findings" loading="lazy"><figcaption><b>Combined playtest findings</b><span>Two rounds, 45 testers, ranked by what both confirmed. Went to the design and ops leads.</span></figcaption></figure><figure class="doc" style="--r: 1.5deg"><img src="assets/257bfe458fdbceab32983d5289b732e4.jpg" alt="Page from VFX + GameCube comparison" loading="lazy"><figcaption><b>VFX + GameCube comparison</b><span>Seven categories scored against the original, with the one fix that mattered most.</span></figcaption></figure><figure class="doc" style="--r: -1.5deg"><img src="assets/cbd196975b0f084780ccccaa9ef21332.jpg" alt="Page from Demo community sweep" loading="lazy"><figcaption><b>Demo community sweep</b><span>307 reviews, forums and Twitch clips in one log, every issue linked to its source.</span></figcaption></figure></div></section>
