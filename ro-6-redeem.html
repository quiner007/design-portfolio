<script>window.__EXT={};

class Component extends DCLogic {
  renderVals() {
    const cells = [];
    let s = 417;
    for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
      const inBox = (x < 3 && y < 3) || (x > 7 && y < 3) || (x < 3 && y > 7);
      const center = (x === 1 || x === 9) && (y === 1 || y === 9);
      s = (s * 1103515245 + 12345) % 2147483648;
      const on = inBox ? !center || true : (s >> 16) % 2 === 0;
      const hole = inBox && !center && ((x % 10 === 1) !== (y % 10 === 1));
      cells.push(on && !hole ? '#0B0D12' : '#F5F3EE');
    }
    return { cells };
  }
}

dcBoot(Component,{});
</script>
