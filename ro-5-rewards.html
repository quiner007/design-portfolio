<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recruit Ops · Rewards · Quin Richards</title>
<meta name="description" content="Quin Richards, UX and game designer.">
<meta property="og:title" content="Recruit Ops · Rewards · Quin Richards">
<meta property="og:description" content="Quin Richards, UX and game designer.">
<meta property="og:image" content="assets/0f172df78bd08b3962814cffe69580f5.jpg">
<meta name="theme-color" content="#0d1a13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d1a13'/%3E%3Cpath d='M12 3 13.6 10.4 21 12 13.6 13.6 12 21 10.4 13.6 3 12 10.4 10.4Z' fill='%23f5c842'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#FFC145}a:hover{color:#F5F3EE}
a:focus-visible,button:focus-visible{outline:2px solid #F5F3EE;outline-offset:2px}
.ch{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.dsp{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
</style>

<style>body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 0;box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; background: #0B0D12; color: #F5F3EE; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="lbl" style="color: #A3A9B6">Spend your points</span><span class="lbl ch" style="padding: 7px 12px; background: rgba(255,193,69,0.12); color: #FFC145; font-size: 13px">◆ 1,550</span></div>
<h1 class="dsp" style="margin: 0; font-size: 34px; line-height: 1">Rewards</h1>
</header>

<main style="flex: 1; overflow: hidden; padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 14px">
<div role="tablist" aria-label="Reward type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid rgba(245,243,238,0.10)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="all: unset; cursor: pointer; min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 2px; border-bottom: 3px solid {{t.bar}}">
<span class="dsp" style="font-size: 14px; color: {{t.c}}">{{t.name}}</span>
<span class="lbl" style="font-size: 10px; color: #A3A9B6">{{t.kind}}</span>
</button>
</sc-for>
</div>

<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A3A9B6">{{blurb}}</p>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="3">
<button onClick="{{i.pick}}" aria-pressed="{{i.on}}" class="ch" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: {{i.bg}}; color: {{i.fg}}; opacity: {{i.op}}">
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; font-size: 15px">{{i.t}}</span><span style="display: block; font-size: 12px; opacity: .8">{{i.d}}</span></span>
<span class="lbl" style="font-size: 14px; white-space: nowrap">{{i.cost}}</span>
</button>
</sc-for>
</div>

<a href="ro-6-redeem.html" class="ch" style="margin-top: auto; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #F5F3EE; color: #0B0D12; text-decoration: none"><span class="dsp" style="font-size: 16px">{{cta}}</span><span aria-hidden="true">→</span></a>
</main>

<nav aria-label="Recruit Ops" style="height: 76px; flex: none; background: #11141A; border-top: 1px solid rgba(245,243,238,0.10); display: flex">
<a href="ro-1-base.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #A3A9B6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 21 7v10l-9 5-9-5V7z"/></svg><span class="lbl">Base</span></a>
<a href="ro-2-tapin.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #A3A9B6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 8a6 6 0 0 1 0 8M12 5a10 10 0 0 1 0 14M4 11a2 2 0 0 1 0 2"/></svg><span class="lbl">Tap in</span></a>
<a href="ro-3-mission.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #A3A9B6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg><span class="lbl">Missions</span></a>
<a href="ro-5-rewards.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #FF5B2E; border-top: 2px solid #FF5B2E"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 12 12 21 4 12z"/></svg><span class="lbl">Rewards</span></a>
</nav>
</div>
</template>
<script src="dc.js"></script>
<script>window.__EXT={};

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'recon', item: 'pin1' }; }
  renderVals() {
    const T = {
      field: { name: 'Field gear', kind: 'Digital', c: '#4CD7E6', blurb: 'Shows up on your recruit profile right away. About one ride.' },
      recon: { name: 'Recon', kind: 'Pins', c: '#FFC145', blurb: 'Enamel pins you can only earn, never buy. Pick up at the campus kiosk.' },
      priority: { name: 'Priority', kind: 'In person', c: '#FF5B2E', blurb: 'Moments in the land itself. Built for return visits.' }
    };
    const I = {
      field: [
        { id: 'f1', t: 'Campus profile frame', d: 'Animated border for your profile picture', cost: '150' },
        { id: 'f2', t: 'Holo recruit avatar', d: 'Profile picture, series 1', cost: '250' },
        { id: 'f3', t: 'Mission: Breakout badge', d: 'Shows on your recruit card', cost: '300' }
      ],
      recon: [
        { id: 'pin1', t: 'Recruit Ops pin · Series 1', d: 'Enamel pin, earned only', cost: '600' },
        { id: 'pin2', t: 'Mission: Breakout pin', d: 'Clear all 3 queue missions first', cost: '900' },
        { id: 'pin3', t: 'Full campus pin set', d: 'Needs every attraction cleared', cost: '1,500', locked: true }
      ],
      priority: [
        { id: 'p1', t: 'Hero mini-mission', d: 'In person with a hero. Save across visits.', cost: '2,500', locked: true },
        { id: 'p2', t: 'Priority return time', d: 'One return time. Save across visits.', cost: '2,000', locked: true }
      ]
    };
    const tab = this.state.tab, cur = T[tab];
    const items = I[tab].map((i) => {
      const on = i.id === this.state.item;
      return Object.assign({}, i, {
        on: on ? 'true' : 'false',
        bg: on ? cur.c : '#151922',
        fg: on ? '#0B0D12' : '#F5F3EE',
        op: i.locked ? '0.45' : '1',
        pick: () => { if (!i.locked) this.setState({ item: i.id }); }
      });
    });
    const sel = I[tab].find((i) => i.id === this.state.item);
    return {
      tabs: Object.keys(T).map((k) => ({
        name: T[k].name, kind: T[k].kind,
        on: k === tab ? 'true' : 'false',
        bar: k === tab ? T[k].c : 'transparent',
        c: k === tab ? '#F5F3EE' : '#A3A9B6',
        pick: () => this.setState({ tab: k, item: null })
      })),
      blurb: cur.blurb,
      items,
      cta: sel ? 'Redeem · ' + sel.cost + ' pts' : 'Pick a reward'
    };
  }
}

dcBoot(Component,{});
</script>
</body>
</html>
